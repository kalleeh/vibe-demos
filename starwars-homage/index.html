<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>A New Hope — an homage · vibe-demos</title>

    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="A New Hope" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --paper: #efe9dc;
        --ink: #1a1a1a;
        --accent: #b04a2f;
        --void: #0a0a0a;
        --crawl: #ffe81f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family: "Fraunces", Georgia, serif;
        -webkit-font-smoothing: antialiased;
      }
      body[data-state="playing"],
      body[data-state="ended"] {
        background: var(--void);
      }

      .stage {
        position: relative;
        width: 100%;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        transition: background 0.4s ease;
      }

      .card {
        max-width: 960px;
        width: 100%;
        text-align: center;
      }
      body[data-state="playing"] .card {
        display: none;
      }

      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #6b6b6b;
      }
      h1 {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: clamp(48px, 9vw, 120px);
        margin: 12px 0 0;
        line-height: 0.95;
      }
      h1 em {
        color: var(--accent);
      }
      .lede {
        max-width: 560px;
        margin: 16px auto 28px;
        font-size: clamp(15px, 1.6vw, 18px);
        line-height: 1.55;
        color: #444;
      }

      .player {
        position: relative;
        width: min(960px, 100%);
        aspect-ratio: 16 / 9;
        margin: 0 auto;
        background: var(--void);
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.5);
      }
      body[data-state="playing"] .player {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        max-width: none;
        aspect-ratio: auto;
        border-radius: 0;
        box-shadow: none;
        z-index: 100;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: var(--void);
      }
      video[data-show="false"] {
        opacity: 0;
        pointer-events: none;
      }

      .poster {
        position: absolute;
        inset: 0;
        background: var(--void) center/cover no-repeat;
        background-image: url("poster.jpg");
        display: grid;
        place-items: center;
      }
      body[data-state="playing"] .poster {
        display: none;
      }

      .play-btn,
      .replay-btn {
        appearance: none;
        border: 0;
        background: rgba(0, 0, 0, 0.55);
        color: var(--crawl);
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        padding: 18px 28px;
        border-radius: 999px;
        cursor: pointer;
        backdrop-filter: blur(6px);
        transition: transform 0.2s ease, background 0.2s ease;
      }
      .play-btn:hover,
      .replay-btn:hover {
        transform: translateY(-1px);
        background: rgba(0, 0, 0, 0.75);
      }

      .ended-overlay {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(0, 0, 0, 0.6);
      }
      body[data-state="ended"] .ended-overlay {
        display: grid;
      }

      /* Buffering indicator — a thin hyperspace-streak bar at the bottom of
         the player while the 18MB film loads. Shown only in the buffering
         state; the % label fills in from the `progress` event when the
         browser reports a buffered range. */
      .buffering {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
        flex-direction: column;
        gap: 8px;
        padding: 0 0 22px;
        align-items: center;
        z-index: 5;
      }
      body[data-state="buffering"] .buffering,
      body[data-buffering="true"] .buffering {
        display: flex;
      }
      body[data-state="buffering"] .poster .play-btn {
        opacity: 0;
        pointer-events: none;
      }

      /* Exit from full-bleed: visible while playing/ended, brightens on pause. */
      .close-btn {
        position: absolute;
        top: max(14px, env(safe-area-inset-top));
        right: max(14px, env(safe-area-inset-right));
        z-index: 6;
        display: none;
        appearance: none;
        border: 0;
        background: rgba(0, 0, 0, 0.55);
        color: var(--crawl);
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        padding: 10px 16px;
        border-radius: 999px;
        cursor: pointer;
        backdrop-filter: blur(6px);
        opacity: 0.6;
        transition: opacity 0.2s ease, background 0.2s ease;
      }
      body[data-state="playing"] .close-btn,
      body[data-state="ended"] .close-btn {
        display: inline-block;
      }
      .close-btn:hover,
      .close-btn:focus-visible,
      body[data-paused="true"] .close-btn {
        opacity: 1;
        background: rgba(0, 0, 0, 0.75);
      }

      /* Load failure: media error, or a 20s stall with no frames. */
      .failed-overlay {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        text-align: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.7);
        z-index: 7;
      }
      body[data-state="failed"] .failed-overlay {
        display: grid;
      }
      body[data-state="failed"] .poster .play-btn {
        opacity: 0;
        pointer-events: none;
      }
      .failed-overlay p {
        margin: 0 0 16px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--crawl);
      }
      .buffering .track {
        width: min(60%, 320px);
        height: 2px;
        background: rgba(255, 232, 31, 0.18);
        overflow: hidden;
        border-radius: 2px;
      }
      .buffering .track::before {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        background: var(--crawl);
        animation: streak 1.1s ease-in-out infinite;
      }
      .buffering .label {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--crawl);
        opacity: 0.85;
      }
      @keyframes streak {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(310%); }
      }

      .meta {
        margin-top: 28px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6b6b6b;
      }
      .meta a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid currentColor;
      }
      .meta a:hover {
        color: var(--accent);
      }

      @media (prefers-reduced-motion: reduce) {
        .play-btn::after {
          content: " (reduced motion)";
          opacity: 0.7;
        }
        .buffering .track::before {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body data-state="idle">
    <main class="stage">
      <article class="card">
        <p class="eyebrow">vibe-demos · 09</p>
        <h1>A New <em>Hope</em></h1>
        <p class="lede">A 42-second cinematic homage in four beats — opening crawl, binary sunset, X-wing launch, trench run.</p>
      </article>

      <div class="player">
        <video
          id="film"
          preload="metadata"
          playsinline
          controls
          data-show="false"
          poster="poster.jpg"
          aria-label="A New Hope — a 42-second cinematic Star Wars homage"
        >
          <source src="film-720.mp4" type="video/mp4" media="(max-width: 768px)" />
          <source src="film.mp4" type="video/mp4" />
        </video>

        <button class="close-btn" id="close-btn" type="button" aria-label="Close film and return">✕ Close</button>

        <div class="poster">
          <button class="play-btn" id="play-btn" type="button" aria-label="Play film">
            ▶ Play film
          </button>
        </div>

        <div class="buffering" role="status" aria-label="Loading film">
          <div class="track" aria-hidden="true"></div>
          <!-- aria-hidden: the % updates on every progress tick; announcing
               each would spam screen readers. The role=status label above
               carries the single "Loading film" announcement. -->
          <div class="label" id="buffering-label" aria-hidden="true">Entering hyperspace…</div>
        </div>

        <div class="ended-overlay">
          <button class="replay-btn" id="replay-btn" type="button" aria-label="Replay film">
            ↻ Replay
          </button>
        </div>

        <div class="failed-overlay" role="alert">
          <div>
            <p>Couldn't load the film — check your connection</p>
            <button class="replay-btn" id="retry-btn" type="button">↻ Retry</button>
          </div>
        </div>
      </div>

      <article class="card meta-card">
        <p class="meta">
          made with <a href="https://github.com/heygen-com/hyperframes" rel="noopener">HyperFrames</a> · <a href="../">back to works</a>
        </p>
      </article>
    </main>

    <script>
      const body = document.body;
      const video = document.getElementById("film");
      const playBtn = document.getElementById("play-btn");
      const replayBtn = document.getElementById("replay-btn");
      const retryBtn = document.getElementById("retry-btn");
      const closeBtn = document.getElementById("close-btn");
      const bufferingLabel = document.getElementById("buffering-label");
      const STALL_MS = 20000;
      let stallTimer = null;

      // Reflect how much of the film has buffered into the status label.
      function updateBufferLabel() {
        if (!video.duration || !video.buffered.length) return;
        const end = video.buffered.end(video.buffered.length - 1);
        const pct = Math.min(100, Math.round((end / video.duration) * 100));
        bufferingLabel.textContent = "Entering hyperspace… " + pct + "%";
      }

      function armStallTimer() {
        clearTimeout(stallTimer);
        stallTimer = setTimeout(fail, STALL_MS);
      }
      function disarmStallTimer() {
        clearTimeout(stallTimer);
        stallTimer = null;
      }

      function fail() {
        disarmStallTimer();
        video.pause();
        body.dataset.state = "failed";
        body.dataset.buffering = "false";
        video.dataset.show = "false";
      }

      function play() {
        // Show buffering feedback immediately; only flip to the full-bleed
        // "playing" state once the browser actually starts rendering frames.
        body.dataset.state = "buffering";
        body.dataset.buffering = "false";
        body.dataset.paused = "false";
        bufferingLabel.textContent = "Entering hyperspace…";
        video.dataset.show = "true";
        video.currentTime = 0;
        updateBufferLabel();
        armStallTimer();
        video.play().catch(() => {
          disarmStallTimer();
          body.dataset.state = "idle";
          video.dataset.show = "false";
        });
      }
      function retry() {
        // Re-select a source from scratch, then play again.
        video.load();
        play();
      }
      function closePlayer() {
        disarmStallTimer();
        video.pause();
        body.dataset.state = "idle";
        body.dataset.buffering = "false";
        body.dataset.paused = "false";
        video.dataset.show = "false";
      }
      playBtn.addEventListener("click", play);
      replayBtn.addEventListener("click", play);
      retryBtn.addEventListener("click", retry);
      closeBtn.addEventListener("click", closePlayer);
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        const st = body.dataset.state;
        if (st === "playing" || st === "ended" || st === "buffering") closePlayer();
      });

      // Buffering lifecycle: progress fills the %, playing reveals the film.
      // Mid-stream waiting/seeking only toggles data-buffering so the player
      // never drops out of full-bleed while it rebuffers or scrubs.
      video.addEventListener("progress", updateBufferLabel);
      video.addEventListener("playing", () => {
        disarmStallTimer();
        body.dataset.state = "playing";
        body.dataset.buffering = "false";
        body.dataset.paused = "false";
      });
      video.addEventListener("waiting", () => {
        if (body.dataset.state === "playing") body.dataset.buffering = "true";
        if (!video.paused) armStallTimer();
        updateBufferLabel();
      });
      video.addEventListener("seeking", () => {
        if (body.dataset.state === "playing") body.dataset.buffering = "true";
      });
      video.addEventListener("seeked", () => {
        body.dataset.buffering = "false";
      });
      video.addEventListener("stalled", updateBufferLabel);
      video.addEventListener("pause", () => {
        disarmStallTimer();
        if (body.dataset.state === "playing") body.dataset.paused = "true";
      });
      video.addEventListener("ended", () => {
        body.dataset.state = "ended";
        body.dataset.buffering = "false";
      });

      // Load failure: a media error, or the last <source> failing to load.
      video.addEventListener("error", () => {
        if (body.dataset.state !== "idle") fail();
      });
      const sources = video.querySelectorAll("source");
      sources[sources.length - 1].addEventListener("error", () => {
        if (body.dataset.state !== "idle") fail();
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
