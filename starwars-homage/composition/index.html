<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A New Hope — vibe-demos</title>
    <style>
      @font-face {
        font-family: "Star Jedi";
        src: url("./fonts/star-jedi.woff2") format("woff2");
        font-display: block;
      }
      body {
        margin: 0;
        background: #0a0a0a;
      }
    </style>
  </head>
  <body>
    <!-- Human-visitor note only. The HyperFrames renderer screenshots the whole
         1920×1080 viewport (and launches Chromium with AutomationControlled
         disabled, so navigator.webdriver is useless), so we remove the note as
         soon as any HyperFrames global is present: the renderer injects
         __name / __HF_VIRTUAL_TIME__ / __hfVariables before page scripts run,
         and the studio/preview runtime attaches __hf / __player after load. -->
    <p id="render-note" style="position:absolute;left:12px;top:8px;margin:0;font:12px/1.4 monospace;color:#888;z-index:1;">Render source — see <a href="../" style="color:#ffe81f;">../</a></p>
    <script>
      (function () {
        var n = document.getElementById("render-note");
        var tries = 0;
        function hf() {
          return navigator.webdriver || window.__hf || window.__player || window.__hfVariables ||
            window.__HF_VIRTUAL_TIME__ !== undefined || typeof window.__name === "function";
        }
        function check() {
          if (!n) return true;
          if (hf()) { n.remove(); n = null; return true; }
          return false;
        }
        if (check()) return;
        window.addEventListener("load", check);
        var iv = setInterval(function () { if (check() || ++tries > 40) clearInterval(iv); }, 250);
      })();
    </script>
    <div data-composition-id="root" data-start="0" data-duration="42" data-width="1920" data-height="1080">
      <!-- Scene 1: Crawl (0 → 14) -->
      <div
        id="scene-crawl"
        data-composition-id="scene-crawl"
        data-composition-src="compositions/crawl.html"
        data-start="0"
        data-duration="14"
        data-track-index="1"
      ></div>

      <!-- Scene 2: Sunset (14 → 22) -->
      <div
        id="scene-sunset"
        data-composition-id="scene-sunset"
        data-composition-src="compositions/sunset.html"
        data-start="14"
        data-duration="8"
        data-track-index="2"
      ></div>

      <!-- Scene 3: Launch (22 → 28) -->
      <div
        id="scene-launch"
        data-composition-id="scene-launch"
        data-composition-src="compositions/launch.html"
        data-start="22"
        data-duration="6"
        data-track-index="3"
      ></div>

      <!-- Scene 4: Trench (28 → 40) -->
      <div
        id="scene-trench"
        data-composition-id="scene-trench"
        data-composition-src="compositions/trench.html"
        data-start="28"
        data-duration="12"
        data-track-index="4"
      ></div>

      <!-- Title card (40 → 42) -->
      <div
        id="scene-title"
        data-composition-id="scene-title"
        data-composition-src="compositions/title.html"
        data-start="40"
        data-duration="2"
        data-track-index="5"
      ></div>

      <!-- Black overlay for crossfades -->
      <div
        id="fader"
        class="clip"
        data-start="0"
        data-duration="42"
        data-track-index="9"
        style="position:absolute;inset:0;background:#000;pointer-events:none;opacity:0;"
      ></div>

      <!-- Original synthesized ambient cue (ffmpeg sine-bed pad composed for this homage; not John Williams). -14 LUFS, 42 s. -->
      <audio
        id="score"
        data-start="0"
        data-duration="42"
        data-track-index="10"
        data-volume="0.85"
        src="audio.mp3"
      ></audio>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const boundaries = [14, 22, 28, 40];
        for (const b of boundaries) {
          tl.to("#fader", { opacity: 1, duration: 0.4, ease: "power2.in", overwrite: "auto" }, b - 0.4);
          tl.to("#fader", { opacity: 0, duration: 0.4, ease: "power2.out", overwrite: "auto" }, b + 0.05);
        }

        window.__timelines["root"] = tl;
      </script>
    </div>
  </body>
</html>
